name: Keep App Alive

on:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://health-monitor-s08a.onrender.com/api/health
